<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Tanks Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="screen">
    <section id="lobbyScreen">
      <h1>Tanks</h1>

      <section class="panel">
        <div id="lobbyActions">
			<button id="createRoomButton">Create Game</button>

			<div class="join-row">
				<input id="roomCodeInput" placeholder="Room code" maxlength="4" />
				<button id="joinRoomButton">Join Game</button>
			</div>
		</div>

		<div id="roomPanel" class="room-panel hidden">
		 <p id="roomCodeText"></p>
		 <button id="copyRoomCodeButton" class="secondary-button">Copy Room Code</button>
		 <div id="playersList"></div>
			<button id="readyButton">Ready</button>
			<button id="backButton" class="secondary-button">Back</button>
		</div>

        <p id="statusText">Create a game or join your friend.</p>
      </section>
    </section>

    <section id="gameScreen" class="game-screen hidden">
<div class="game-hud">
  <strong>Tanks Match</strong>
  <span id="scoreText">Blue 0 - Red 0</span>
  <span id="healthText">Health 200/200</span>
  <span id="gameRoomText"></span>
</div>

<div id="winnerBanner" class="winner-banner hidden"></div>

<div class="battlefield">
  <canvas id="gameCanvas" width="960" height="552"></canvas>
</div>

    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
