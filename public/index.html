<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Tanks Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="screen">
    <section id="lobbyScreen">
      <h1>Tanks</h1>

      <section class="panel">
        <button id="createRoomButton">Create Game</button>

        <div class="join-row">
          <input id="roomCodeInput" placeholder="Room code" maxlength="4" />
          <button id="joinRoomButton">Join Game</button>
        </div>

        <div id="roomPanel" class="room-panel hidden">
          <p id="roomCodeText"></p>
          <div id="playersList"></div>
          <button id="readyButton">Ready</button>
        </div>

        <p id="statusText">Create a game or join your friend.</p>
      </section>
    </section>

    <section id="gameScreen" class="game-screen hidden">
      <div class="game-hud">
        <strong>Tanks Match</strong>
        <span id="gameRoomText"></span>
      </div>

<div class="battlefield">
  <div class="match-splash">
    <h2>Player 1 vs Player 2</h2>
    <p>Capture the enemy flag</p>
  </div>

  <div class="base left-base">
    <span>BASE A</span>
  </div>

  <div class="road"></div>

  <div class="tank player-one-tank"></div>
  <div class="tank player-two-tank"></div>

  <div class="base right-base">
    <span>BASE B</span>
  </div>
</div>

    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
